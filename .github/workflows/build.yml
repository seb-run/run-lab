# seb-metrics — pipeline autonome
# Déclencheurs :
#   - repository_dispatch "strava-activity" : envoyé par le Cloudflare Worker
#     quand Strava notifie une nouvelle activité (webhook)
#   - schedule : filet de sécurité quotidien à 05:45 UTC
#   - workflow_dispatch : lancement manuel depuis l'onglet Actions
name: build-dashboard

on:
  repository_dispatch:
    types: [strava-activity, coach-validate]
  schedule:
    - cron: '45 5 * * *'
  # Rebuild auto quand le code du dashboard change (pas de boucle : les commits
  # du CI ne touchent que data/, hors de ces paths — sauf plan_nyc.json qui
  # est autorisé et protégé par le if: sur l'auteur, plus bas).
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'templates/**'
      - 'modules/**'
      - 'scripts/**'
      - 'build.py'
      - 'manifest.webmanifest'
      - 'sw.js'
      # Un import de plan (scripts/import_plan_v2.py) doit rebuilder le HTML,
      # sinon Pages continue de servir l'ancien.
      - 'data/plan_nyc.json'
  workflow_dispatch:
    inputs:
      regen_plan:
        description: 'Régénérer le plan complet'
        type: boolean
        default: false
      repair_cache:
        description: "Réparer l'historique (laps comptés en temps écoulé)"
        type: boolean
        default: false
      force_resync:
        description: 'Re-télécharger les activités Strava déjà en cache'
        type: boolean
        default: false
      force_garmin:
        description: 'Re-télécharger les .fit Garmin déjà traités'
        type: boolean
        default: false
      lookback_days:
        description: 'Fenêtre de sync Strava en jours'
        type: string
        default: '14'

concurrency:
  group: build-dashboard
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install jinja2 anthropic

      # Validation d'une proposition du coach depuis le dashboard.
      # Le payload vient d'Internet : il transite par des variables
      # d'environnement et jamais par interpolation directe dans le shell,
      # sinon un identifiant forgé permettrait d'exécuter du code ici.
      - name: Appliquer une validation du coach
        if: github.event_name == 'repository_dispatch' && github.event.action == 'coach-validate'
        env:
          PROP_ID: ${{ github.event.client_payload.id }}
          PROP_ACTION: ${{ github.event.client_payload.action }}
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: python3 scripts/ci/apply_proposal.py --id "$PROP_ID" --action "$PROP_ACTION"

      - name: Sync Strava (API directe)
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          SEB_DATA_DIR: ${{ github.workspace }}/data
          SYNC_LOOKBACK_DAYS: ${{ inputs.lookback_days || '14' }}
          SYNC_FORCE: ${{ inputs.force_resync && '1' || '' }}
        run: python3 scripts/ci/strava_api_sync.py || echo "⚠ Sync Strava indisponible — build poursuivi avec le cache"

      # Correctif rétroactif : laps Strava comptés en temps écoulé (pause montre)
      # → séances régulières classées à tort en fractionné. Lancement manuel.
      - name: Réparer l'historique
        if: inputs.repair_cache == true
        run: python3 scripts/repair_stop_laps.py --data "${{ github.workspace }}/data"

      # Données Garmin que Strava ne transmet pas (dynamique de course, charge,
      # ressenti montre, R-R). Étape silencieuse tant que les secrets sont absents.
      - name: Récupérer les .fit Garmin (via intervals.icu)
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_LOOKBACK: ${{ inputs.lookback_days || '7' }}
          INTERVALS_FORCE: ${{ inputs.force_garmin && '1' || '' }}
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: python3 scripts/ci/intervals_sync.py

      - name: Intégrer les .fit au cache
        env:
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: pip install fitdecode -q && python3 scripts/ci/fit_ingest.py --data "${{ github.workspace }}/data"

      - name: Build dashboard
        env:
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: |
          REGEN=""
          if [ "${{ inputs.regen_plan }}" = "true" ]; then REGEN="--regen-plan"; fi
          python3 build.py --strava-sync --no-push $REGEN

      - name: Coach IA (analyse + ajustements)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: python3 scripts/ci/ai_coach.py || echo "⚠ Coach IA indisponible — build publié sans analyse"

      # Débrief de la dernière séance : lecture des métriques Garmin comparées
      # à la référence personnelle. Ne rappelle pas le modèle si la séance a
      # déjà été débriefée.
      - name: Débrief de séance (IA)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: python3 scripts/ci/session_debrief.py || echo "⚠ Débrief indisponible — build publié sans"

      - name: Rebuild HTML (avec analyse coach)
        env:
          SEB_DATA_DIR: ${{ github.workspace }}/data
        run: python3 build.py --rebuild-html

      # Seules les DONNÉES sont commitées (cache, plan, analyses coach).
      # Le HTML part sur Pages via artefact → plus de commits qui polluent main.
      - name: Persist data
        run: |
          git config user.name "seb-metrics-bot"
          git config user.email "actions@github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Données inchangées."
          else
            # [skip ci] : empêche le push du bot de re-déclencher un workflow
            # via le trigger `push:` (qui inclut désormais data/plan_nyc.json).
            git commit -m "data: sync $(date -u +%Y-%m-%dT%H:%M) [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      - name: Assemble site
        run: |
          mkdir -p site
          cp output/index.html site/index.html
          cp manifest.webmanifest sw.js icon-192.png icon-512.png icon-512-maskable.png apple-touch-icon.png site/
          # Calendrier iCal : publié à la racine du site pour que l'abonnement
          # iPhone se resynchronise tout seul à chaque build.
          python3 scripts/build_ics.py site/plan_nyc.ics
          # Document de référence du plan
          python3 scripts/render_plan_doc.py site/plan.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
